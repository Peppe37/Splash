name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: cost
    attributes:
      label: Does it need to run in the background?
      description: Splash must stay nearly free while a wallpaper is applied. If your idea needs work while idle, say why.

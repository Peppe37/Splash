name: Feature request
description: An idea to make Splash better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the use case first, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Sketches and examples from other apps are welcome.
  - type: textarea
    id: cost
    attributes:
      label: Does it need to run in the background?
      description: Splash must stay nearly free while a wallpaper is applied. If your idea needs work while idle, say why.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to help build it

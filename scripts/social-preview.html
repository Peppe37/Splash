<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; width:1200px; height:630px; overflow:hidden; background:#0a0a0a; color:#e5e5e5;
    font:16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { display:flex; height:100%; }
  .copy { flex:1; padding:72px 0 0 80px; }
  .brand { display:flex; align-items:center; gap:14px; font-size:26px; font-weight:500; letter-spacing:-.02em; color:#fff; }
  .brand img { width:44px; height:44px; }
  h1 { font-weight:400; font-size:72px; line-height:1.02; letter-spacing:-.04em; margin:88px 0 22px; color:#fff; }
  p { font-size:26px; color:#8c8c86; margin:0; max-width:480px; line-height:1.35; }
  .shot { width:520px; margin:80px 80px 0 0; align-self:flex-start; }
  .shot div { border:1px solid #2a2a2a; border-radius:14px; overflow:hidden; height:380px; }
  .shot img { width:100%; height:100%; object-fit:cover; display:block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="copy">
    <div class="brand"><img src="../site/assets/icon.png" alt="">Splash</div>
    <h1>Make your<br>desktop move.</h1>
    <p>Animated wallpapers for macOS. Free, open source, very light.</p>
  </div>
  <div class="shot"><div><img src="../site/assets/presets/aurora.png" alt=""></div></div>
</div>
</body>
</html>

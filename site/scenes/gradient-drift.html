<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<script>
window.__splashBoot = {"fps": 30, "params": {"colorA": "#5b3df5", "colorB": "#f5568b", "colorC": "#2ec4b6", "speed": 1}, "stillAfter": 0, "detail": 1.5};
(function () {
  var boot = window.__splashBoot;
  var nativeRAF = window.requestAnimationFrame.bind(window);
  var nativeCancel = window.cancelAnimationFrame.bind(window);
  var fps = boot.fps, interval = 1000 / fps, last = 0, paused = false, scheduled = false, nextId = 1;
  var queue = new Map();
  var paramListeners = [], pauseListeners = [];

  function loop(now) {
    scheduled = false;
    if (paused) return;
    if (now - last >= interval - 2) {
      last = now;
      var batch = Array.from(queue.entries());
      queue.clear();
      batch.forEach(function (entry) { entry[1](now); });
      if (boot.stillAfter > 0 && --boot.stillAfter === 0) { window.splash._pause(); return; }
    }
    if (queue.size > 0) schedule();
  }
  function schedule() {
    if (!scheduled && !paused) { scheduled = true; nativeRAF(loop); }
  }
  window.requestAnimationFrame = function (callback) {
    var id = nextId++;
    queue.set(id, callback);
    schedule();
    return id;
  };
  window.cancelAnimationFrame = function (id) { queue.delete(id); };

  var started = performance.now(), virtualTime = null;
  window.splash = {
    params: boot.params,
    get fps() { return fps; },
    /** Resolution divisor the host asks for: canvas pixels = device pixels / detail. */
    get detail() { return boot.detail; },
    get paused() { return paused; },
    /** Seconds since the scene started, not counting time spent paused. */
    get time() { return virtualTime !== null ? virtualTime : (performance.now() - started) / 1000; },
    /** Called with the new values whenever the user changes a parameter. */
    onParams: function (callback) { paramListeners.push(callback); callback(window.splash.params); },
    onPause: function (callback) { pauseListeners.push(callback); },
    _setParams: function (values) {
      window.splash.params = values;
      paramListeners.forEach(function (callback) { callback(values); });
    },
    _setFPS: function (value) { fps = value; interval = 1000 / value; },
    /** Used by the baker: fixes the clock at t seconds, then runs one frame now. */
    _renderAt: function (t) {
      virtualTime = t;
      var batch = Array.from(queue.entries());
      queue.clear();
      batch.forEach(function (entry) { entry[1](performance.now()); });
    },
    _pause: function () {
      if (paused) return;
      paused = true;
      pauseListeners.forEach(function (callback) { callback(true); });
    },
    _resume: function () {
      if (!paused) return;
      paused = false;
      pauseListeners.forEach(function (callback) { callback(false); });
      schedule();
    }
  };
})();
window.addEventListener('message', function (event) {
  if (event.data && event.data.params) splash._setParams(Object.assign({}, splash.params, event.data.params));
});
</script>
<canvas id="c"></canvas>
<script>
  // Soft blobs, so it draws at a low resolution and lets the browser scale it up: the blur hides it, and it costs far less.
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const blobs = [
    { key: "colorA", x: 0.25, y: 0.30, r: 0.55, phase: 0.0 },
    { key: "colorB", x: 0.75, y: 0.35, r: 0.50, phase: 2.1 },
    { key: "colorC", x: 0.50, y: 0.80, r: 0.60, phase: 4.2 },
  ];
  const LOOP = 20; // seconds, same as loopSeconds in scene.json

  function resize() {
    // Soft gradients: a quarter of the resolution the host asks for is plenty.
    const divisor = splash.detail * 4;
    canvas.width = Math.max(64, Math.round(window.innerWidth * window.devicePixelRatio / divisor));
    canvas.height = Math.max(36, Math.round(window.innerHeight * window.devicePixelRatio / divisor));
  }
  window.addEventListener("resize", resize);
  resize();

  function draw() {
    const params = splash.params;
    const t = (splash.time * params.speed) % LOOP;
    const angle = (t / LOOP) * Math.PI * 2;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = "lighter";
    for (const blob of blobs) {
      const x = (blob.x + 0.12 * Math.cos(angle + blob.phase)) * canvas.width;
      const y = (blob.y + 0.12 * Math.sin(angle + blob.phase)) * canvas.height;
      const radius = blob.r * canvas.height;
      const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
      gradient.addColorStop(0, params[blob.key] + "cc");
      gradient.addColorStop(1, params[blob.key] + "00");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
